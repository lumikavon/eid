log_format eid_safe '$remote_addr $request_method $uri $status';
server {
  listen 8080;
  server_name localhost;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_backend http://api:8000;
  set $identity_backend http://keycloak:8080;
  set $web_backend http://web:4173;
  access_log /var/log/nginx/access.log eid_safe;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ { proxy_pass $api_backend; proxy_set_header X-Request-ID $http_x_request_id; proxy_set_header traceparent $http_traceparent; add_header Cache-Control no-store always; }
  location /health/ { proxy_pass $api_backend; proxy_set_header X-Request-ID $http_x_request_id; proxy_set_header traceparent $http_traceparent; add_header Cache-Control no-store always; }
  location /realms/ { proxy_pass $identity_backend; proxy_set_header Host localhost:18080; proxy_set_header X-Forwarded-Proto http; }
  location /resources/ { proxy_pass $identity_backend; proxy_set_header Host localhost:18080; }
  location / { proxy_pass $web_backend; }
}
