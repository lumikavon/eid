[project]
name = "eid-workspace"
version = "0.1.0"
requires-python = "==3.12.14"
dependencies = [
  "alembic==1.16.5",
  "boto3==1.40.30",
  "celery==5.5.3",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.2.10",
  "pydantic-settings==2.10.1",
  "pyjwt[crypto]==2.13.0",
  "redis==6.4.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "pytest==9.1.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.12",
]

[tool.uv.workspace]
members = ["edw-api", "edw-worker"]

[tool.uv.sources]
edw-api = { workspace = true }
edw-worker = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["edw-api/src", "edw-worker/src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
